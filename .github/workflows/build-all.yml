name: Build Android APK & Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Android APK build
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
      - name: Build Web Distribution
        run: npm run build
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          if [[ -d "$SDK_ROOT/cmdline-tools" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [[ -z "$SDKMANAGER" ]]; then echo "Android sdkmanager bulunamadı: $SDK_ROOT"; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Initialize & Sync Capacitor Android Project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build Debug APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Check optional Release signing configuration
        id: signing-check
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$STORE_FILE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Report unsigned Release requirement
        if: steps.signing-check.outputs.enabled != 'true'
        run: echo "::notice::Only Debug APK is built; signed Release APK requires ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. No key was generated."
      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DioramaStudio-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Windows portable EXE build
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
      - name: Build Windows Portable Executable
        run: npm run build:win
      - name: Upload Windows Portable EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DioramaStudio-Windows
          path: dist-electron/*.exe
          if-no-files-found: error
