<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>3D & 2D Sahne, Karakter, Reji ve Render Stüdyosu</title>
    <meta name="description" content="Vite ve Capacitor uyumlu monokrom Three.js sahnesi, zaman çizelgesi eylem kuyruğu ve video/ekran görüntüsü dışa aktarma araçları." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 3D Canvas Mount -->
    <div id="canvas-container"></div>
    <div id="cctv-preview" class="cctv-preview" hidden aria-label="Bağımsız CCTV mini görünümü">
      <span class="cctv-preview-label">CCTV · BAĞIMSIZ GÖRÜNÜM</span>
    </div>

    <!-- Dokunmatik / Tıklama Yönlendirme İpucu -->
    <div class="hud-hint-pill">
      <span class="hud-hint-dot"></span>
      <span id="hud-hint-text">Zemine dokun: Karakter yürür | Kapıya dokun: Açılır | Boşluğu sürükle: Kamera döner</span>
    </div>

    <!-- Sürükle-Bırak Katmanı (Drag & Drop) -->
    <div id="drag-overlay" class="drag-overlay">
      <div class="drag-overlay-box">
        <div class="drag-icon">📁</div>
        <div class="drag-title">Dosyayı Buraya Bırakın</div>
        <div class="drag-sub">.glb, .gltf, .png, .jpg, .webp</div>
      </div>
    </div>

    <div id="joystick-controls" class="movement-control joystick-control" aria-label="Hareket joystick'i" style="display: none;">
      <div id="joystick-base" class="joystick-base"><div id="joystick-knob" class="joystick-knob"></div></div>
    </div>
    <div id="arrow-controls" class="movement-control arrow-control" aria-label="Karakter yön tuşları" style="display: none;">
      <button class="direction-button direction-up" data-direction="up" aria-label="İleri">▲</button>
      <button class="direction-button direction-left" data-direction="left" aria-label="Sola">◄</button>
      <button class="direction-button direction-down" data-direction="down" aria-label="Geri">▼</button>
      <button class="direction-button direction-right" data-direction="right" aria-label="Sağa">▶</button>
    </div>

    <!-- Üst Monokrom Başlık & Durum Çubuğu -->
    <header class="top-hud">
      <div class="hud-brand">
        <span class="brand-square">REJİ</span>
        <div class="brand-text">
          <div class="brand-name">STUDIO // TIMELINE & RENDER</div>
          <div class="brand-desc">Capacitor & WebGL Engine</div>
        </div>
      </div>

      <div class="hud-actions">
        <!-- Video Kayıt Rozeti -->
        <div id="badge-recorder-mode" class="hud-badge active-record" style="display: none;">
          <span class="badge-indicator pulse"></span>
          <span id="label-recorder-mode">● REC 00:00</span>
        </div>

        <div id="badge-record-mode" class="hud-badge active-record" style="display: none;">
          <span class="badge-indicator pulse"></span>
          <span id="label-record-mode">Kayıt: Tıklananı Ekle</span>
        </div>

        <div id="badge-timeline-status" class="hud-badge">
          <span class="badge-indicator"></span>
          <span id="label-timeline-status">Reji: Hazır</span>
        </div>

        <div id="badge-camera-mode" class="hud-badge outline">
          <span class="badge-indicator"></span>
          <span id="label-camera-mode">Serbest Orbit</span>
        </div>

        <div id="badge-door-mode" class="hud-badge outline">
          <span class="badge-indicator"></span>
          <span id="label-door-mode">Kapı: Kapalı</span>
        </div>

        <button id="btn-quick-play" class="hud-btn primary" title="Reji Kuyruğunu Başlat / Duraklat (Space)">
          ▶ Oynat
        </button>

        <button id="btn-quick-door" class="hud-btn" title="Menteşeli kapıyı aç veya kapat">
          Kapı Tetikle
        </button>

        <button id="btn-cinematic-mode" class="hud-btn" title="Paneli Gizle / Sinematik Görünüm (Kısayol: H)">
          [H] Sinematik
        </button>

        <button id="btn-open-help" class="hud-btn icon-btn" title="Yardım & Bilgi">
          ?
        </button>
      </div>
    </header>

    <!-- Studio panel injected at runtime from src/ui/studio-panel.html -->
    <div id="studio-panel-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
